[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alap-api"
version = "0.2.0"
description = "ALAP AI Companion platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "redis>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "structlog>=24.4,<26.0",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "PyJWT>=2.9",
  "email-validator>=2.2",
  "cryptography>=43,<47",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "migrations*"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
