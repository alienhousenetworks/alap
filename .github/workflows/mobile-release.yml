name: Signed mobile release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version (for example 1.2.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate Android release inputs
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo 'Invalid release version' >&2; exit 1;; esac
          test -n "$KEYSTORE" && test -n "$ALIAS" && test -n "$KEY_PASSWORD" && test -n "$STORE_PASSWORD"
          case "$API_BASE_URL" in https://*) ;; *) echo 'API_BASE_URL must be HTTPS' >&2; exit 1;; esac
      - name: Generate native project and sign Android bundle
        working-directory: apps/mobile
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          VERSION: ${{ inputs.version }}
        run: |
          flutter create --platforms=android --org com.alienhousenetworks .
          echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$ALIAS
          storeFile=upload-keystore.jks
          PROPS
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = '    buildTypes {'
          if marker not in s:
              raise SystemExit('Flutter Gradle buildTypes block not found')
          signing = '''    signingConfigs {
                create("release") {
                    val props = java.util.Properties().apply { load(rootProject.file("key.properties").inputStream()) }
                    keyAlias = props["keyAlias"] as String
                    keyPassword = props["keyPassword"] as String
                    storeFile = file("upload-keystore.jks")
                    storePassword = props["storePassword"] as String
                }
            }
'''
          if 'create("release")' not in s:
              s = s.replace(marker, signing + marker)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY
          flutter pub get
          flutter build appbundle --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER" --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: alap-android-aab
          path: apps/mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate iOS release inputs
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE: ${{ vars.IOS_BUNDLE_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo 'Invalid release version' >&2; exit 1;; esac
          test -n "$P12" && test -n "$P12_PASSWORD" && test -n "$PROFILE" && test -n "$TEAM" && test -n "$BUNDLE"
          case "$API_BASE_URL" in https://*) ;; *) echo 'API_BASE_URL must be HTTPS' >&2; exit 1;; esac
      - name: Install Apple distribution certificate and profile
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          security create-keychain -p "$RUNNER_TEMP/keychain-password" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$RUNNER_TEMP/keychain-password" build.keychain
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP/keychain-password" build.keychain
          security list-keychain -d user -s build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          case "$APP_ID" in *."$BUNDLE") ;; *) echo 'Provisioning profile does not match IOS_BUNDLE_ID' >&2; exit 1;; esac
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Generate and archive iOS app
        working-directory: apps/mobile
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE: ${{ vars.IOS_BUNDLE_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          VERSION: ${{ inputs.version }}
        run: |
          flutter create --platforms=ios --org com.alienhousenetworks .
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('ios/Runner.xcodeproj/project.pbxproj')
          s = p.read_text()
          s = s.replace('PRODUCT_BUNDLE_IDENTIFIER = com.alienhousenetworks.alap;', f'PRODUCT_BUNDLE_IDENTIFIER = {os.environ["BUNDLE"]};')
          s = s.replace('DEVELOPMENT_TEAM = "";', f'DEVELOPMENT_TEAM = {os.environ["TEAM"]};')
          s = s.replace('PROVISIONING_PROFILE_SPECIFIER = "";', f'PROVISIONING_PROFILE_SPECIFIER = "{os.environ["PROFILE_NAME"]}";')
          s = s.replace('CODE_SIGN_IDENTITY = "Apple Development";', 'CODE_SIGN_IDENTITY = "Apple Distribution";')
          s = s.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          p.write_text(s)
          PY
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>$TEAM</string><key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$PROFILE_NAME</string></dict><key>stripSwiftSymbols</key><true/></dict></plist>
          PLIST
          flutter pub get
          flutter build ipa --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER" --dart-define=API_BASE_URL="$API_BASE_URL" --export-options-plist=ios/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: alap-ios-ipa
          path: apps/mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
