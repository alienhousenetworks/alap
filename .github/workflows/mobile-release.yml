name: Mobile Release Builds

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build signed Android App Bundle
        type: boolean
        default: false
      build_ios:
        description: Build signed iOS IPA
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.alap.app .
      - run: flutter pub get
      - name: Configure upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF
          python tool/configure_android_signing.py
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle --release --dart-define=API_BASE_URL=${{ vars.ALAP_PRODUCTION_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: alap-android-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    if: ${{ inputs.build_ios }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --org com.alap.app .
      - run: flutter pub get
      - name: Install Apple signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          IOS_BUNDLE_ID: ${{ vars.ALAP_IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$PROFILE_BASE64"
          KEYCHAIN="$RUNNER_TEMP/alap-signing.keychain-db"
          CERT="$RUNNER_TEMP/apple_distribution.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/alap.mobileprovision"
          sed -i '' "s/com.alap.app/$IOS_BUNDLE_ID/g" ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $IOS_BUNDLE_ID" ios/Runner/Info.plist
      - name: Prepare export options
        env:
          EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          test -n "$EXPORT_OPTIONS_BASE64"
          echo "$EXPORT_OPTIONS_BASE64" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" --dart-define=API_BASE_URL=${{ vars.ALAP_PRODUCTION_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: alap-ios-ipa
          path: apps/mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
