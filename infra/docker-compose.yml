services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: alap
      POSTGRES_USER: alap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports: ["5432:5432"]
    volumes: [alap_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alap -d alap"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [alap_redis:/data]
volumes:
  alap_postgres:
  alap_redis:
